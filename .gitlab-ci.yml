variables:
  BASE_CONTAINER: quay.io/jupyter/datascience-notebook:latest

image:
  name: gcr.io/kaniko-project/executor:debug
  entrypoint: [""]

stages:
  - build

before_script:
  - mkdir -p /kaniko/.docker
  - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}"
      > /kaniko/.docker/config.json

build-main:
  stage: build
  tags:
    - shared
  only:
    refs:
      - main
    changes:
      - Dockerfile
      - .gitlab-ci.yml
  script:
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination $CI_REGISTRY_IMAGE/$CI_PROJECT_NAME:latest
      --destination $CI_REGISTRY_IMAGE/$CI_PROJECT_NAME:$CI_COMMIT_SHORT_SHA
      --destination $CI_REGISTRY_IMAGE/$CI_PROJECT_NAME:$(date +%Y-%m)
      --build-arg=BASE_CONTAINER=$BASE_CONTAINER
      --use-new-run
  resource_group: build
  timeout: 10h
